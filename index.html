<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>milan.cat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    
    #container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    #content {
      background: #1a1a1a;
      border: 1px solid #404040;
      border-radius: 8px;
      padding: 30px;
    }
    
    #content h1 { font-size: 2em; margin: 30px 0 20px 0; color: #fff; }
    #content h2 { font-size: 1.5em; margin: 25px 0 15px 0; color: #fff; }
    #content h3 { font-size: 1.25em; margin: 20px 0 12px 0; color: #fff; }
    #content h4, #content h5, #content h6 { margin: 15px 0 10px 0; color: #fff; }
    
    #content p { margin: 12px 0; }
    #content ul, #content ol { margin: 12px 0 12px 20px; }
    #content li { margin: 6px 0; }
    
    #content a { color: #5b9bff; text-decoration: none; }
    #content a:hover { text-decoration: underline; }
    
    #content code {
      background: #0d0d0d;
      color: #e0e0e0;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: "Menlo", "Monaco", "Courier New", monospace;
      font-size: 0.9em;
      word-break: break-word
    }
    
    #content pre {
      background: #0d0d0d;
      border: 1px solid #404040;
      border-radius: 6px;
      padding: 15px;
      margin: 15px 0;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: pre-wrap;
      max-width: 100%;
    }
    
    #content pre code {
      background: none;
      padding: 0;
      color: inherit;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    
    #content blockquote {
      border-left: 3px solid #404040;
      padding-left: 15px;
      margin: 15px 0;
      color: #b0b0b0;
    }
    
    #content table {
      border-collapse: collapse;
      width: 100%;
      margin: 15px 0;
      table-layout: auto;
    }
    
    #content table th, #content table td {
      border: 1px solid #404040;
      padding: 10px;
      text-align: left;
      word-break: break-word;
    }
    
    #content table th {
      background: #262626;
      color: #fff;
    }

    img {
        width: 100%;
    }

  </style>
</head>
<body>
  <div id="container">
    <div id="content">Cargando...</div>
  </div>

  <script>
    fetch('report.md')
      .then(r => r.text())
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
        document.querySelectorAll('pre code').forEach(block => {
          hljs.highlightElement(block);
        });
      })
      .catch(() => {
        document.getElementById('content').innerHTML = '<p>Error: md no encontrado</p>';
      });
  </script>
</body>
</html>
